# Rotary encoder
CONFIG_GPIO=y

# LED Strip
CONFIG_PWM=y

# Application
CONFIG_MAIN_STACK_SIZE=5096
CONFIG_BOOT_DELAY=500
CONFIG_LOG=y


# Openthread and Coap
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_COAP=y
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_MLE_INFORM_PREVIOUS_PARENT_ON_REATTACH=y
CONFIG_OPENTHREAD_POWER_SUPPLY_EXTERNAL_STABLE=y
CONFIG_OPENTHREAD_PARENT_SEARCH=y
CONFIG_OPENTHREAD_FTD=y


CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10

# SRP
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_NETDIAG_VENDOR_INFO=y

## Important to get an IP reachable from out of the thread network
CONFIG_OPENTHREAD_SLAAC=y

# Stack config
CONFIG_MBEDTLS_HEAP_SIZE=8192



# Flash and NVS
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Settings Subsystem bind to NVS
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_OPENTHREAD_SETTINGS_RAM=n

# RGB STATUS LED
CONFIG_I2S=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_I2S=y

